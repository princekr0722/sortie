[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortie"
version = "0.1.0"
description = "Automated job applications across Indian job portals and career pages"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "pypdf>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
sortie = "sortie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sortie = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
